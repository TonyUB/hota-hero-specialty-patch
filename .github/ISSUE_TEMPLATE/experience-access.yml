name: 申请借阅开发经验 / Request experience access
description: 申请只读访问本项目的私有技术经验库。
title: "[经验借阅申请] "
labels:
  - experience-access
body:
  - type: markdown
    attributes:
      value: |
        技术路线、诊断记录、失败复盘和内部维护资料保存在私有知识库中，不随公开补丁发布。
        请完整填写以下内容。仓库所有者会逐项审核；提交申请不代表自动授权。
  - type: input
    id: github_user
    attributes:
      label: GitHub 用户名
      description: 获得授权后将使用该账号访问私有知识库。
      placeholder: example-user
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 借阅目的
      description: 请说明项目、研究目标及需要解决的问题。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 需要的资料范围
      description: 请尽量列明英雄、机制、版本或技术主题。
    validations:
      required: true
  - type: dropdown
    id: use
    attributes:
      label: 使用方式
      options:
        - 仅个人研究 / Personal research only
        - 非商业开源项目 / Non-commercial open-source project
        - 其他（请在补充说明中解释） / Other (explain below)
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: 使用承诺
      options:
        - label: 未经书面许可，不转载、镜像、公开复制或向第三方转交资料。
          required: true
        - label: 不将资料用于销售、收费服务或其他商业行为。
          required: true
        - label: 接受仓库所有者可随时撤销访问权限。
          required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 可附项目地址、既有成果或其他有助于审核的信息。

